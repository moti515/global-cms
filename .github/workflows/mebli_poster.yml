name: Publish Furniture Content

on:
  workflow_dispatch:      # Запуск повністю передано в руки зовнішніх API-запитів
    inputs:
      forced_mode:
        description: 'Режим публікації'
        required: true
        default: 'fb_post'
        type: choice
        options:
          - fb_post
          - ig_post
          - ig_story
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення системних залежностей (FFmpeg та шрифти)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu-core

    - name: Встановлення бібліотек Python
      run: |
        python -m pip install --upgrade pip
        pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client pillow pillow-heif pytz pyyaml

    # --- КРОК 1: ЗАПУСК ЗВИЧАЙНИХ ПОСТІВ (Працює у корені репозиторію) ---
    - name: Запуск публікатора постів (FB / IG Post)
      if: github.event.inputs.forced_mode != 'ig_story'
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        IG_USER_ID: ${{ secrets.MEBLI_IG_USER_ID }}
        FB_PAGE_ID: ${{ secrets.MEBLI_FB_PAGE_ID }}
        META_ACCESS_TOKEN: ${{ secrets.MEBLI_META_ACCESS_TOKEN }}
      run: |
        echo "📋 [Система] Режим: [${{ github.event.inputs.forced_mode }}]"
        python publish_content_mebli.py ${{ github.event.inputs.forced_mode }} "Меблі"

    # --- КРОК 2: ЗАПУСК СТОРІС (Аналог команди cd + запуск скрипта сторіс) ---
    - name: Запуск публікатора сторіс (IG Story)
      if: github.event.inputs.forced_mode == 'ig_story'
      working-directory: mebli_instagram_story
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        IG_USER_ID: ${{ secrets.MEBLI_IG_USER_ID }}
        FB_PAGE_ID: ${{ secrets.MEBLI_FB_PAGE_ID }}
        META_ACCESS_TOKEN: ${{ secrets.MEBLI_META_ACCESS_TOKEN }}
      run: |
        python publish_content_mebli_storys.py ${{ github.event.inputs.forced_mode }} "Меблі"
