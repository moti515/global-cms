- name: Запуск публікатора контенту
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        IG_USER_ID: ${{ secrets.MEBLI_IG_USER_ID }}
        FB_PAGE_ID: ${{ secrets.MEBLI_FB_PAGE_ID }}
        META_ACCESS_TOKEN: ${{ secrets.MEBLI_META_ACCESS_TOKEN }}
        FORCED_MODE: ${{ github.event.inputs.forced_mode }}
      run: |
        python << 'EOF'
        import os
        import subprocess
        import sys

        # Отримуємо режим та назву вкладки
        mode = os.environ.get('FORCED_MODE', 'fb_post')
        target_tab = "Меблі"
        
        print(f"🚀 [Система] Зовнішній запуск API успішний!")
        print(f"📋 [Система] Режим: [{mode.upper()}], Аркуш: [{target_tab}]")
        
        # Динамічний вибір скрипта та робочої папки залежно від режиму
        if mode == 'ig_story':
            target_dir = os.path.join('global-cms', 'mebli_instagram_story')
            script_name = 'publish_content_mebli_srorys.py'
            
            # ДІАГНОСТИКА: Якщо папки немає, виведемо що є в корінні
            if not os.path.exists(target_dir):
                print(f"❌ [Помилка] Папку '{target_dir}' не знайдено в репозиторії!")
                print(f"📂 Вміст поточного коріння репозиторію: {os.listdir('.')}")
                os.makedirs(target_dir, exist_ok=True)
                print(f"📁 Тимчасово створено порожню папку: {target_dir}")

            print(f"📂 [Система] Зміна робочої директорії на: {target_dir}")
            os.chdir(target_dir)
        else:
            script_name = 'publish_content_mebli.py'
            
        print(f"🏃‍♂️ [Система] Запуск скрипта: {script_name}...")
        
        # Передаємо параметри у вибраний скрипт
        result = subprocess.run(['python', script_name, mode, target_tab])
        
        # Повертаємо код завершення скрипта
        sys.exit(result.returncode)
        EOF
