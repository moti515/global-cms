name: Publish Friday Content

on:
  workflow_dispatch:      # Запуск повністю передано в руки зовнішніх API-запитів
    inputs:
      forced_mode:
        description: 'Режим публікації'
        required: true
        default: 'post'
        type: choice
        options:
          - post
          - story

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення системних залежностей (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Встановлення бібліотек Python
      run: |
        python -m pip install --upgrade pip
        pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client pillow pillow-heif pytz

    - name: Запуск публікатора контенту
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Секрети Friday:
        IG_USER_ID: ${{ secrets.FRIDAY_IG_USER_ID }}
        FB_PAGE_ID: ${{ secrets.FRIDAY_FB_PAGE_ID }}
        META_ACCESS_TOKEN: ${{ secrets.FRIDAY_META_ACCESS_TOKEN }}
      run: |
        python << 'EOF'
        import os
        import subprocess

        # Скрипт просто бере режим, який йому чітко передав cron-job.org через inputs
        mode = os.environ.get('FORCED_MODE', 'post')
        target_tab = "П'ятниця"
        
        print(f" [Система] Зовнішній запуск API успішний!")
        print(f" [Система] Режим: [{mode.upper()}], Аркуш: [{target_tab}]")
        
        subprocess.run(['python', 'publish_content.py', mode, target_tab], check=True)
        EOF
