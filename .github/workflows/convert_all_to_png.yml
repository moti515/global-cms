name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення базових залежностей для аналізу Диску
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Швидке сканування Google Диску
      id: scan_step
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_all_to_png.py --scan

    - name: Встановлення LibreOffice для офісних документів
      if: steps.scan_step.outputs.has_office == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libreoffice
        libreoffice --version

    - name: Збірка легкого конвертера LibreDWG з коду
      if: steps.scan_step.outputs.has_dwg == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf libtool texinfo build-essential git
        
        git clone --depth 1 --recursive https://github.com/LibreDWG/libredwg.git
        cd libredwg
        
        ./autogen.sh
        ./configure --disable-bindings --disable-json
        
        make -j$(nproc) -C src
        make -j$(nproc) -C programs
        
        sudo make -C src install
        sudo make -C programs install
        sudo ldconfig
        dwg2dxf --version

    # Бібліотеки для CAD та TIFF
    - name: Встановлення Графічних та CAD бібліотек Python
      if: steps.scan_step.outputs.has_dxf == 'true' || steps.scan_step.outputs.has_dwg == 'true' || steps.scan_step.outputs.has_office == 'true' || steps.scan_step.outputs.has_tif == 'true'
      run: pip install ezdxf matplotlib pillow

    # PDF, Офісні формати та MHTML потребують PyMuPDF для нарізки PDF сторінок
    - name: Встановлення PDF бібліотек Python
      if: steps.scan_step.outputs.has_pdf == 'true' || steps.scan_step.outputs.has_office == 'true' || steps.scan_step.outputs.has_mhtml == 'true'
      run: pip install pymupdf

    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_all_to_png.py
