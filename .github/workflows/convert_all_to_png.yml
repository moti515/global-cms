name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення базових залежностей для аналізу Диску
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Швидке сканування Google Диску
      id: scan_step
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py --scan

    # Складна збірка LibreDWG запускається ТІЛЬКИ якщо знайдено нові файли .dwg
    - name: Встановлення залежностей та збірка Офіційного LibreDWG
      if: steps.scan_step.outputs.has_dwg == 'true'
      run: |
        sudo apt-get update
        
        # 1. Спробуємо встановити вже готовий пакет з репозиторію Ubuntu
        if sudo apt-get install -y libredwg-utils; then
          echo "Успішно встановлено готову утиліту з apt за кілька секунд!"
        else
          echo "Готового пакета немає в apt. Починаємо швидку збірку з коду..."
          
          # 2. Якщо пакета немає, збираємо з коду, але використовуємо всі ядра процесора
          sudo apt-get install -y autoconf libtool texinfo build-essential unzip
          curl -L https://codeload.github.com/LibreDWG/libredwg/zip/refs/heads/master -o libredwg.zip
          unzip libredwg.zip
          cd libredwg-master
          
          ./autogen.sh
          ./configure --disable-bindings
          
          # Прапорець -j$(nproc) задіє всі доступні ядра процесора раннера
          make -j$(nproc)
          
          sudo make install
          sudo ldconfig
        fi
        
        # Перевірка, чи утиліта на місці
        which dwg2dxf

    # Бібліотеки для CAD ставимо лише за наявності dxf або dwg файлів
    - name: Встановлення CAD бібліотек Python
      if: steps.scan_step.outputs.has_dxf == 'true' || steps.scan_step.outputs.has_dwg == 'true'
      run: pip install ezdxf matplotlib

    # Модуль для PDF ставимо лише за наявності pdf файлів
    - name: Встановлення PDF бібліотек Python
      if: steps.scan_step.outputs.has_pdf == 'true'
      run: pip install pymupdf

    # Запуск основного процесу (обробить лише те, для чого встановилися пакети)
    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py
