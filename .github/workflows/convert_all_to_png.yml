name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення базових залежностей для аналізу Диску
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Швидке сканування Google Диску
      id: scan_step
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py --scan

    - name: Збірка легкого конвертера LibreDWG з коду
      if: steps.scan_step.outputs.has_dwg == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf libtool texinfo build-essential git
        
        git clone --depth 1 --recursive https://github.com/LibreDWG/libredwg.git
        cd libredwg
        
        ./autogen.sh
        ./configure --disable-bindings --disable-json
        
        # Компілюємо ТІЛЬКИ ядро (src) та консольні утиліти (programs)
        make -j$(nproc) -C src
        make -j$(nproc) -C programs
        
        # Встановлюємо лише їх, минаючи зламану папку examples
        sudo make -C src install
        sudo make -C programs install
        sudo ldconfig
        
        # Перевіряємо, що все на місці й працює
        dwg2dxf --version

    # Бібліотеки для CAD ставимо лише за наявності dxf або dwg файлів
    - name: Встановлення CAD бібліотек Python
      if: steps.scan_step.outputs.has_dxf == 'true' || steps.scan_step.outputs.has_dwg == 'true'
      run: pip install ezdxf matplotlib pillow

    # Модуль для PDF ставимо лише за наявності pdf файлів
    - name: Встановлення PDF бібліотек Python
      if: steps.scan_step.outputs.has_pdf == 'true'
      run: pip install pymupdf

    # Запуск основного процесу (обробить лише те, для чого встановилися пакети)
    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py
