- name: Завантаження та збірка LibreDWG (Розумний скрипт)
      run: |
        # 1. Пробуємо завантажити гілку 'main' з браузерним User-Agent
        echo "Спроба завантажити гілку main..."
        curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://github.com/LibreDWG/libdwg/archive/refs/heads/main.tar.gz -o libdwg.tar.gz
        
        # 2. Якщо файл занадто малий (менше 500 байтів), то це текст помилки. Пробуємо гілку 'master'
        if [ $(stat -c%s libdwg.tar.gz) -lt 500 ]; then
          echo "Гілка main не знайдена або доступ обмежено. Пробуємо гілку master..."
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://github.com/LibreDWG/libdwg/archive/refs/heads/master.tar.gz -o libdwg.tar.gz
        fi
        
        # 3. Якщо і 'master' збіг за помилкою, виводимо її вміст в лог для діагностики
        if [ $(stat -c%s libdwg.tar.gz) -lt 500 ]; then
          echo "=== ПОМИЛКА ЗАВАНТАЖЕННЯ! Вміст відповіді сервера: ==="
          cat libdwg.tar.gz
          echo -e "\n====================================================="
          exit 1
        fi

        # 4. Розпаковуємо успішно завантажений архів
        tar -xzf libdwg.tar.gz
        
        # 5. Визначаємо, яка папка створилася, і переходимо в неї
        if [ -d "libdwg-main" ]; then
          cd libdwg-main
        else
          cd libdwg-master
        fi
        
        # 6. Компіляція та встановлення в систему
        ./autogen.sh
        ./configure
        make
        sudo make install
        sudo ldconfig
