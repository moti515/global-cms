name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення базових залежностей для аналізу Диску
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Швидке сканування Google Диску
      id: scan_step
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py --scan

    # Встановлюємо вже готовий офіційний пакет інструментів LibreDWG з репозиторію Ubuntu 24.04
    - name: Встановлення готового інструментарію LibreDWG
      if: steps.scan_step.outputs.has_dwg == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libredwg-utils
        
        # Перевіряємо, що утиліта dwg2dxf доступна в системі
        dwg2dxf --version

    # Бібліотеки для CAD ставимо лише за наявності dxf або dwg файлів
    - name: Встановлення CAD бібліотек Python
      if: steps.scan_step.outputs.has_dxf == 'true' || steps.scan_step.outputs.has_dwg == 'true'
      run: pip install ezdxf matplotlib

    # Модуль для PDF ставимо лише за наявності pdf файлів
    - name: Встановлення PDF бібліотек Python
      if: steps.scan_step.outputs.has_pdf == 'true'
      run: pip install pymupdf

    # Запуск основного процесу (обробить лише те, для чого встановилися пакети)
    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py
