name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення базових залежностей для аналізу Диску
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Швидке сканування Google Диску
      id: scan_step
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py --scan

    # Замість складної збірки LibreDWG, ставимо готовий промисловий конвертер від ODA
    - name: Встановлення ODA File Converter (Teigha)
      if: steps.scan_step.outputs.has_dwg == 'true'
      run: |
        sudo apt-get update
        # Замінено libgl1-mesa-glx на актуальний для Ubuntu 24.04 пакет libgl1
        sudo apt-get install -y libgl1 xvfb libfontconfig1 libxrender1 libxext6 libglib2.0-0 libxi6 libxrandr2
        
        # Завантажуємо офіційний релізний deb-пакет утиліти
        curl -L "https://download.opendesign.com/guestfiles/ODAFileConverter/ODAFileConverter_QT5_lnxX64_8.3dll.deb" -o oda.deb
        
        # Встановлюємо утиліту в систему
        sudo dpkg -i oda.deb || sudo apt-get install -f -y
        
        # Перевіряємо наявність у системному шляху
        which ODAFileConverter

    # Бібліотеки для CAD ставимо лише за наявності dxf або dwg файлів
    - name: Встановлення CAD бібліотек Python
      if: steps.scan_step.outputs.has_dxf == 'true' || steps.scan_step.outputs.has_dwg == 'true'
      run: pip install ezdxf matplotlib

    # Модуль для PDF ставимо лише за наявності pdf файлів
    - name: Встановлення PDF бібліотек Python
      if: steps.scan_step.outputs.has_pdf == 'true'
      run: pip install pymupdf

    # Запуск основного процесу (обробить лише те, для чого встановилися пакети)
    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py
