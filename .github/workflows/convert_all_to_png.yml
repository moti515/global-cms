name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення залежностей для збірки LibreDWG
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf libtool texinfo build-essential git

    - name: Клонування та збірка LibreDWG (dwg2dxf)
      run: |
        git clone --depth 1 https://github.com/LibreDWG/libdwg.git
        cd libdwg
        ./autogen.sh
        ./configure
        make
        sudo make install
        sudo ldconfig

    - name: Встановлення бібліотек Python
      run: |
        python -m pip install --upgrade pip
        pip install pymupdf ezdxf matplotlib google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
        
    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py
