name: Google Drive all to Images

on:
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Встановлення базових залежностей для аналізу Диску
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Швидке сканування Google Диску
      id: scan_step
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py --scan

    - name: Створення та збірка Docker-конвертера ODA
      if: steps.scan_step.outputs.has_dwg == 'true'
      run: |
        # Створюємо ізольовану папку для контексту збірки
        mkdir -p dwg-converter
        
        # 1. Записуємо Dockerfile, який ви знайшли
        cat << 'EOF' > dwg-converter/Dockerfile
        FROM opensuse/leap:15.4
        RUN zypper --non-interactive refresh && zypper --non-interactive up
        RUN zypper --non-interactive in --no-recommends bash wget xvfb-run fontconfig \
            libICE6 libQt5Core5 libQt5DBus5 libQt5Gui5 libQt5Network5 libQt5Widgets5 \
            libSM6 libdouble-conversion3 libevdev2 libfontconfig1 libgobject-2_0-0 \
            libgraphite2-3 libgudev-1_0-0 libharfbuzz0 libinput10 libjpeg8 libmtdev1 \
            libpcre2-16-0 libts0 libwacom-data libwacom2 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-util1 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxkbcommon0 timezone
            
        RUN mkdir -p /dwg-to-dxf
        WORKDIR /dwg-to-dxf
        
        RUN wget --no-check-certificate https://download.opendesign.com/guestfiles/Demo/ODAFileConverter_QT5_lnxX64_7.2dll_21.11.rpm
        RUN zypper --non-interactive in --no-recommends --allow-unsigned-rpm ODAFileConverter_QT5_lnxX64_7.2dll_21.11.rpm
        
        COPY ./dwg-to-dxf.sh /dwg-to-dxf/dwg-to-dxf
        RUN chmod +x /dwg-to-dxf/dwg-to-dxf
        CMD /dwg-to-dxf/dwg-to-dxf
        EOF

        # 2. Записуємо скрипт автоматизації всередину контейнера
        cat << 'EOF' > dwg-converter/dwg-to-dxf.sh
        #!/bin/bash
        set -e
        rm -rf /tmp/.X99-lock
        Xvfb :99 -screen 0 1024x768x16 &
        while [ ! -e /tmp/.X11-unix/X99 ]; do sleep 0.1; done
        export DXF_ENCODING=UTF-8
        export XDG_RUNTIME_DIR='/tmp/runtime-root'
        
        # Шукаємо всі DWG у змонтованій папці /data та конвертуємо їх у DXF
        for folder in $(find /data -type f -name "*.dwg" -exec dirname {} \; | sort -u); do
            DISPLAY=:99.0 ODAFileConverter "${folder}" "${folder}" ACAD2018 DXF 1 1 "*.dwg"
        done
        echo "Conversion finished successfully!"
        EOF
        
        # 3. Збираємо локальний Docker-образ
        docker build -t local/dwg-to-dxf dwg-converter/

    # Бібліотеки для CAD ставимо лише за наявності dxf або dwg файлів
    - name: Встановлення CAD бібліотек Python
      if: steps.scan_step.outputs.has_dxf == 'true' || steps.scan_step.outputs.has_dwg == 'true'
      run: pip install ezdxf matplotlib

    # Модуль для PDF ставимо лише за наявності pdf файлів
    - name: Встановлення PDF бібліотек Python
      if: steps.scan_step.outputs.has_pdf == 'true'
      run: pip install pymupdf

    # Запуск основного процесу (обробить лише те, для чого встановилися пакети)
    - name: Запуск скрипту конвертації
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python convert_pdf_to_png.py
