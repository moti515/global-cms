name: Sync Furniture Registry

on:
  repository_dispatch:
    types: [cron_trigger]
  workflow_dispatch: # Дозволяє також запускати скрипт вручну через веб-інтерфейс GitHub

jobs:
  sync-registry:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib pillow pillow-heif requests

    - name: Run Registry Sync Script
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
      run: |
        python furniture_registry.py
