name: Sync Furniture Registry

on:
  repository_dispatch:
    types: [cron_trigger] # Для виклику через cron-job.org
  workflow_dispatch:      # Дозволяє запуск вручну кнопкою або через стандартний GitHub API

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Прискорює повторні запуски, кешуючи бібліотеки

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-api-python-client pillow pillow-heif requests

    - name: Run Sync
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
      run: python furniture_registry.py
