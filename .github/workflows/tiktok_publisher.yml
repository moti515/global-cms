name: TikTok Automated Publisher

on:
  workflow_dispatch: # Дозволяє запускати вручну з інтерфейсу GitHub
  # Закоментований крон для майбутнього використання (запуск щодня о 12:00 за UTC)
  # schedule:
  #   - cron: '0 12 * * *'

jobs:
  publish-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        # Важливе виправлення безпеки ImageMagick, щоб дозволити використання шрифтів у TextClip
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"//g' /etc/ImageMagick-6/policy.xml

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        pip install requests pillow pillow-heif moviepy

    - name: Run TikTok Automation Script
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        CLIENT_KEY_TIKTOK: ${{ secrets.CLIENT_KEY_TIKTOK }}
        CLIENT_SECRET_TIKTOK: ${{ secrets.CLIENT_SECRET_TIKTOK }}
      run: python publish_content_tiktok.py
