name: TikTok Automated Publisher

on:
  workflow_dispatch: # Дозволяє запускати вручну з інтерфейсу GitHub
  # schedule:
  #   - cron: '0 12 * * *'

# Переводимо екшени на Node 24, щоб прибрати попередження GitHub у логах
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-video:
    runs-on: ubuntu-latest
    
    # 🔐 ДОДАНО: Дозволяємо воркфло записувати зміни назад у репозиторій
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        
        # Універсальне виправлення політики безпеки ImageMagick
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-*/policy.xml || true
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml || true

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth requests pillow pillow-heif "moviepy<2.0"

    - name: Run TikTok Automation Script
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        CLIENT_KEY_TIKTOK: ${{ secrets.CLIENT_KEY_TIKTOK }}
        CLIENT_SECRET_TIKTOK: ${{ secrets.CLIENT_SECRET_TIKTOK }}
      run: python publish_content_tiktok.py

    # 🛠️ ВИПРАВЛЕНО: Вирівняно відступи для кроку збереження токенів
    - name: Commit and push updated TikTok tokens
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tiktok_tokens.json
        git commit -m "chore: auto-update tiktok tokens [skip ci]" || echo "No changes to commit"
        git push
