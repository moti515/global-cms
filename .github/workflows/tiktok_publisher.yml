name: TikTok Automated Publisher

on:
  workflow_dispatch: # Дозволяє запускати вручну з інтерфейсу GitHub
  # Закоментований крон для майбутнього використання (запуск щодня о 12:00 за UTC)
  # schedule:
  #   - cron: '0 12 * * *'

# Переводимо екшени на Node 24, щоб прибрати попередження GitHub у логах
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Оновлено до 3.12, щоб уникнути попереджень від Google SDK
        cache: 'pip' # Кешує завантажені пакети для швидших наступних запусків

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        
        # Універсальне виправлення політик безпеки ImageMagick (працює для будь-якої версії v6/v7)
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-*/policy.xml || true
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml || true

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Встановлюємо всі необхідні бібліотеки для Google Drive, Pillow, HEIC та MoviePy
        pip install google-api-python-client google-auth requests pillow pillow-heif moviepy

    - name: Run TikTok Automation Script
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        CLIENT_KEY_TIKTOK: ${{ secrets.CLIENT_KEY_TIKTOK }}
        CLIENT_SECRET_TIKTOK: ${{ secrets.CLIENT_SECRET_TIKTOK }}
      run: python publish_content_tiktok.py
