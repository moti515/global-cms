name: TikTok Automated Publisher

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Режим запуску (manual - швидкий тест, cron - штатний розклад)'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - cron

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-video:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # КРОК 1: Мінімальні залежності для Pre-flight (3-5 секунд)
    - name: Install Minimal Pre-flight Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-api-python-client google-auth pillow

    # КРОК 2: Швидка перевірка розкладу, GDrive та TikTok API
    - name: Fast Pre-flight & Schedule Check
      id: preflight
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        CLIENT_KEY_TIKTOK: ${{ secrets.CLIENT_KEY_TIKTOK }}
        CLIENT_SECRET_TIKTOK: ${{ secrets.CLIENT_SECRET_TIKTOK }}
        RUN_MODE: ${{ github.event.inputs.run_mode }}
      run: |
        cd tiktok
        python check_preflight.py

    # КРОК 3: Системні пакети (виконуються ТІЛЬКИ якщо Pre-flight дав зелене світло)
    - name: Install System Dependencies (FFmpeg, ImageMagick & Fonts)
      if: steps.preflight.outputs.should_run == 'true'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends ffmpeg imagemagick fonts-dejavu
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-*/policy.xml || true
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml || true

    # КРОК 4: Важкі Python-залежності для обробки медіа
    - name: Install Heavy Python Dependencies
      if: steps.preflight.outputs.should_run == 'true'
      run: |
        pip install pillow-heif "moviepy<2.0" pilmoji

    # КРОК 5: Повний завантажувальний та монтажний скрипт
    - name: Run TikTok Automation Script
      if: steps.preflight.outputs.should_run == 'true'
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        CLIENT_KEY_TIKTOK: ${{ secrets.CLIENT_KEY_TIKTOK }}
        CLIENT_SECRET_TIKTOK: ${{ secrets.CLIENT_SECRET_TIKTOK }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        RUN_MODE: ${{ github.event.inputs.run_mode }}
      run: |
        cd tiktok
        python main_tiktok.py

    # КРОК 6: Збереження оновлених токенів (виконується тільки якщо робота запускалася)
    - name: Commit and push updated TikTok tokens
      if: steps.preflight.outputs.should_run == 'true' && always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tiktok/tiktok_tokens.json
        git commit -m "chore: auto-update tiktok tokens [skip ci]" || echo "No changes to commit"
        git push
