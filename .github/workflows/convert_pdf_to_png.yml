name: Google Drive PDF to Images

on:
  workflow_dispatch: # Дозволяє запускати процес вручну кнопкою "Run workflow"

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка репозиторію (Checkout)
      uses: actions/checkout@v4

    - name: Налаштування Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Встановлення необхідних бібліотек
      run: |
        python -m pip install --upgrade pip
        pip install pymupdf google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Запуск скрипту конвертації
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
      run: python convert_pdf_to_png.py
