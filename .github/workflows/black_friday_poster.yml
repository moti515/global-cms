name: Автоматична публікація контенту (П'ятниця)

on:
  schedule:
    # Запуск строго за європейським часом (з урахуванням UTC на GitHub):
    - cron: '0 7 * * *'   # 09:00 ранку (Час для ранкової Сторіс)
    - cron: '0 11 * * *'  # 13:00 дня   (Час для обіднього Поста)
    - cron: '0 18 * * *'  # 20:00 вечора (Час для вечірньої Сторіс)
  workflow_dispatch:      # Кнопка для ручного запуску в інтерфейсі GitHub

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду репозиторію
      uses: actions/checkout@v3

    - name: Налаштування Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Встановлення системних залежностей (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Встановлення бібліотек Python
      run: |
        pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client pillow pillow-heif pytz

    - name: Запуск публікатора контенту
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python -c "
        from datetime import datetime
        import pytz
        import subprocess

        # Визначаємо локальний час у Німеччині
        tz = pytz.timezone('Europe/Berlin')
        now = datetime.now(tz)
        
        # Автоматично визначаємо режим: Сторіс чи Пост залежно від години запуску
        hour = now.hour
        mode = 'story' if hour in [8, 9, 19, 20, 21] else 'post'
        
        # Передаємо СУВОРУ назву вашого цільового аркуша контенту
        target_tab = \"П'ятниця\"
        
        print(f' [Система] Поточний час у Берліні: {now.strftime(\"%H:%M\")}')
        print(f' [Система] Запуск для сторінки [П\'ятниця]: Режим [{mode.upper()}], Аркуш [{target_tab}]')
        
        # Викликаємо ваш скрипт: publish_content.py <post/story> <П'ятниця>
        subprocess.run(['python', 'publish_content.py', mode, target_tab], check=True)
