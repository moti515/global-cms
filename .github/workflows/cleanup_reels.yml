name: 🧹 Cleanup Old Facebook Reels

on:
  workflow_dispatch:
    # Ручний запуск із можливістю вказати вік відео в днях
    inputs:
      days_to_keep:
        description: 'Видаляти Reels старіші за (днів):'
        required: true
        default: '30'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонування репозиторію
        uses: actions/checkout@v4

      - name: 🐍 Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: 🗑️ Виконання скрипту очищення Reels
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DAYS_TO_KEEP: ${{ github.event.inputs.days_to_keep || '30' }}
        run: |
          python mebli_instagram_story/delete_old_reels.py
